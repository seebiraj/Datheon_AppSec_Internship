<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#040711"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="greenAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="950" height="520" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Title Badge -->
  <rect x="40" y="25" width="870" height="55" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#38bdf8">
    DATHEON ZERO-TRUST API GATEWAY &amp; DEFENSIVE ROUTE ARCHITECTURE
  </text>
  <rect x="740" y="37" width="150" height="30" rx="6" fill="#065f46" stroke="#10b981" stroke-width="1"/>
  <text x="758" y="57" font-family="sans-serif" font-size="12" font-weight="bold" fill="#a7f3d0">OWASP API:2023</text>

  <!-- Flow Boxes -->
  <!-- Box 1: Client Request -->
  <g transform="translate(40, 110)">
    <rect width="160" height="230" rx="12" fill="url(#blueCard)" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="80" cy="50" r="28" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="80" y="56" text-anchor="middle" font-size="22">🌐</text>
    <text x="80" y="105" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#f8fafc">Client Layer</text>
    <text x="80" y="130" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">Web / Mobile / cURL</text>
    <line x1="20" y1="145" x2="140" y2="145" stroke="#334155" stroke-width="1"/>
    <text x="80" y="170" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#cbd5e1">• HTTP-Only Cookie</text>
    <text x="80" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Bearer JWT Token</text>
    <text x="80" y="210" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#cbd5e1">• URL Query Params</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 205 225 L 245 225" stroke="#06b6d4" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="4,4"/>
  <polygon points="245,220 255,225 245,230" fill="#06b6d4"/>

  <!-- Box 2: Gateway Security Perimeter -->
  <g transform="translate(260, 110)">
    <rect width="200" height="230" rx="12" fill="url(#blueCard)" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="20" y="20" width="160" height="35" rx="6" fill="#312e81" stroke="#4f46e5" stroke-width="1"/>
    <text x="100" y="43" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#c7d2fe">Security Headers</text>
    <text x="100" y="75" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a5b4fc">CSP | HSTS | X-Frame: DENY</text>
    
    <rect x="20" y="95" width="160" height="40" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="100" y="118" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#e0e7ff">Sliding Rate Limiter</text>
    <text x="100" y="130" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94a3b8">X-RateLimit (RFC 6585)</text>

    <rect x="20" y="150" width="160" height="45" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="100" y="172" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">Session Auth Guard</text>
    <text x="100" y="187" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">Cryptographic HS256</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 465 225 L 505 225" stroke="#6366f1" stroke-width="3"/>
  <polygon points="505,220 515,225 505,230" fill="#6366f1"/>

  <!-- Box 3: Authorization Engine -->
  <g transform="translate(520, 110)">
    <rect width="210" height="230" rx="12" fill="url(#blueCard)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="20" y="20" width="170" height="35" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="105" y="43" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#a7f3d0">BOLA Defense Middleware</text>

    <text x="105" y="80" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#f8fafc">Subject vs Object Check</text>
    <rect x="20" y="95" width="170" height="55" rx="6" fill="#132a26" stroke="#059669" stroke-width="1"/>
    <text x="105" y="115" text-anchor="middle" font-family="monospace" font-size="10" fill="#34d399">req.user.id == target.id</text>
    <text x="105" y="135" text-anchor="middle" font-family="monospace" font-size="10" fill="#f87171">else return HTTP 403</text>

    <rect x="20" y="160" width="170" height="50" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="105" y="180" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">PII Masking Engine</text>
    <text x="105" y="197" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">j***7@gmail.com</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 735 225 L 775 225" stroke="#10b981" stroke-width="3"/>
  <polygon points="775,220 785,225 775,230" fill="#10b981"/>

  <!-- Box 4: Multi-Tenant Data Store -->
  <g transform="translate(780, 110)">
    <rect width="130" height="230" rx="12" fill="url(#blueCard)" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="65" cy="50" r="26" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="65" y="57" text-anchor="middle" font-size="22">🗄️</text>
    <text x="65" y="105" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fde68a">Data Store</text>
    <text x="65" y="125" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94a3b8">Scoped Queries</text>
    <line x1="15" y1="140" x2="115" y2="140" stroke="#334155" stroke-width="1"/>
    <text x="65" y="165" text-anchor="middle" font-family="monospace" font-size="9" fill="#cbd5e1">WHERE id = :id</text>
    <text x="65" y="180" text-anchor="middle" font-family="monospace" font-size="9" fill="#10b981">AND user = :uid</text>
    <text x="65" y="205" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#10b981">✔ Isolated</text>
  </g>

  <!-- Footer Stats Bar -->
  <g transform="translate(40, 375)">
    <rect width="870" height="110" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>
    
    <g transform="translate(30, 20)">
      <text x="0" y="20" font-family="sans-serif" font-size="12" fill="#64748b">TASK 1 FUZZING</text>
      <text x="0" y="45" font-family="sans-serif" font-size="18" font-weight="bold" fill="#f87171">CVSS 7.5 HIGH</text>
      <text x="0" y="65" font-family="sans-serif" font-size="11" fill="#94a3b8">Automated Recon Fuzzer</text>
    </g>

    <line x1="220" y1="20" x2="220" y2="90" stroke="#1e293b" stroke-width="1.5"/>

    <g transform="translate(250, 20)">
      <text x="0" y="20" font-family="sans-serif" font-size="12" fill="#64748b">TASK 2 BOLA GUARD</text>
      <text x="0" y="45" font-family="sans-serif" font-size="18" font-weight="bold" fill="#34d399">100% REJECT 403</text>
      <text x="0" y="65" font-family="sans-serif" font-size="11" fill="#94a3b8">Multi-Tenant Scoped DB</text>
    </g>

    <line x1="440" y1="20" x2="440" y2="90" stroke="#1e293b" stroke-width="1.5"/>

    <g transform="translate(470, 20)">
      <text x="0" y="20" font-family="sans-serif" font-size="12" fill="#64748b">TASK 3 SESSION DEFENSE</text>
      <text x="0" y="45" font-family="sans-serif" font-size="18" font-weight="bold" fill="#38bdf8">HTTP-ONLY COOKIES</text>
      <text x="0" y="65" font-family="sans-serif" font-size="11" fill="#94a3b8">Sliding Window Rate Limit</text>
    </g>

    <line x1="670" y1="20" x2="670" y2="90" stroke="#1e293b" stroke-width="1.5"/>

    <g transform="translate(700, 20)">
      <text x="0" y="20" font-family="sans-serif" font-size="12" fill="#64748b">TASK 4 DAST CI/CD</text>
      <text x="0" y="45" font-family="sans-serif" font-size="18" font-weight="bold" fill="#a78bfa">ZERO PII LEAK</text>
      <text x="0" y="65" font-family="sans-serif" font-size="11" fill="#94a3b8">Automated GitHub Actions</text>
    </g>
  </g>
</svg>
